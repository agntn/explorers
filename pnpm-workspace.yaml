packages:
  - docs

allowBuilds:
  "@google/genai": false
  better-sqlite3: true
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  vue-demi: true
  workerd: true

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0

# One version per name for the library and docs/, which bundles the library from ../src.
catalogs:
  deps:
    "@agntn/chains": 0.3.11
    "@modelcontextprotocol/sdk": 1.32.1
    better-sqlite3: 12.11.1
    citty: 0.2.2
    consola: 3.4.2
    docus: 5.15.0
    h3: 1.15.11
    jiti: 2.7.0
    nuxt: 4.6.2
    ohash: 2.0.12
    ufo: 1.6.4
    zod: 4.6.7
  dev:
    "@agntn/ox": 0.1.0
    "@earendil-works/pi-coding-agent": latest
    "@earendil-works/pi-tui": latest
    "@iconify-json/lucide": 1.2.139
    "@iconify-json/simple-icons": 1.2.98
    "@iconify-json/token": 1.2.42
    "@iconify-json/vscode-icons": 1.2.84
    "@nuxt/content": 3.16.0
    "@nuxt/ui": 4.12.0
    "@oh-my-pi/omptype": 17.4.2
    "@oh-my-pi/pi-coding-agent": 17.4.2
    "@types/node": latest
    "@vueuse/core": 14.4.0
    changelogen: 0.6.2
    obuild: 0.4.43
    shiki: 4.5.0
    tsx: 4.23.15
    typebox: 1.4.2
    typescript: 6.0.3
    wrangler: 4.151.3

cleanupUnusedCatalogs: true

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

minimumReleaseAgeExclude:
  - "@agntn/*"

# Stops pnpm 12 from opening the lockfile with an env document, which GitHub reads as zero dependencies.
pmOnFail: ignore
